name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Tests never touch a real OS credential store.
      PTM_TEST_MEMORY_KEYTAR: '1'
    steps:
      - uses: actions/checkout@v5

      # keytar is an optionalDependency with a graceful runtime fallback, but
      # libsecret lets its prebuild install cleanly on Linux runners.
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - uses: actions/setup-node@v5
        with:
          # node:sqlite needs a recent runtime; keep in sync with package.json engines.
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: .playwright-results
          retention-days: 7
