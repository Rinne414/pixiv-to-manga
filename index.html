<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixiv-to-Manga Studio</title>
    <script>
      // Apply the persisted (or OS-preferred) theme before first paint to avoid a flash.
      // 'ptm-theme' mirrors THEME_STORAGE_KEY in src/theme.ts — keep both in sync.
      ;(function () {
        try {
          var saved = localStorage.getItem('ptm-theme')
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
